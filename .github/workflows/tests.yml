name: Tests

on:
  push:
    branches: [main]
  pull_request:

# The actions are taken by commit, not by tag: a tag can be moved to other code,
# a commit cannot. To update one, change the commit and the version behind it together.
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.3', laravel: '12.*' }
          - { php: '8.4', laravel: '12.*' }
          - { php: '8.4', laravel: '13.*' }
          - { php: '8.5', laravel: '13.*' }
          # PHP 8.6 with Laravel 13 only: the test tools for Laravel 12 (Testbench 10 with Pest 4)
          # do not install on PHP 8.6 yet.
          - { php: '8.6', laravel: '13.*' }
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      - run: composer update --with "illuminate/support:${{ matrix.laravel }}" --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pest

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/pint --test
